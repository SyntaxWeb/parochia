<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">Parochia — Logo Horizontal Dark</title>
<desc id="desc">Logo horizontal Parochia para fundos escuros, em branco, azul claro e dourado.</desc>
<defs>
  <linearGradient id="blueLight" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#DCE8F5"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F5D78E"/>
    <stop offset="0.5" stop-color="#D4AF37"/>
    <stop offset="1" stop-color="#B88A22"/>
  </linearGradient>
</defs>

<!-- Fundo transparente: desenvolvido especificamente para superfícies escuras -->

<!-- Símbolo -->
<g transform="translate(35 24)">
  <path fill="url(#blueLight)" d="
    M35 12 H142
    C205 12 244 49 244 105
    C244 151 216 181 174 190
    L141 156
    L105 188
    V251 H35 Z
    M105 70 V132 H141
    C163 132 177 121 177 101
    C177 81 163 70 141 70 Z"/>
  <!-- Igreja recortada em azul escuro para leitura sobre fundos navy -->
  <path fill="#0F2D54" d="M83 187 L139 139 L195 187 L177 187 L177 251 L101 251 L101 187 Z"/>
  <path fill="#FFFFFF" d="M126 251 V211 C126 196 137 185 139 185 C141 185 152 196 152 211 V251 Z"/>
  <!-- Cruz dourada -->
  <path fill="url(#gold)" d="M127 35 H151 V68 H184 V92 H151 V135 H127 V92 H94 V68 H127 Z"/>
</g>

<!-- Divisor -->
<rect x="315" y="58" width="3" height="184" rx="1.5" fill="#D4AF37"/>

<!-- Wordmark -->
<text x="370" y="145"
      fill="#FFFFFF"
      font-family="Cinzel, 'Times New Roman', Georgia, serif"
      font-size="91"
      font-weight="600"
      letter-spacing="5">PAROCHIA</text>

<line x1="374" y1="171" x2="1085" y2="171" stroke="#D4AF37" stroke-width="2"/>
<polygon points="730,164 737,171 730,178 723,171" fill="#D4AF37"/>

<text x="377" y="215"
      fill="#DCE8F5"
      font-family="Inter, Arial, sans-serif"
      font-size="25"
      font-weight="500"
      letter-spacing="7">SISTEMA DE GESTÃO PAROQUIAL</text>
</svg>